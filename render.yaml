services:
  - type: web
    name: electricity-billing-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      name: billing-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
